{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-xl-5 text-center py-4">
        <div class="mx-auto mb-4 d-flex align-items-center justify-content-center" style="width:96px;height:96px;border:2px solid var(--m-ink);">
            <i class="fa-solid {{ feature.icon }} fa-2x" style="color:var(--m-accent);"></i>
        </div>
        <p class="small fw-bold text-uppercase text-muted mb-1" style="letter-spacing:1.6px;">Coming soon</p>
        <h3 class="fw-bold mb-2">{{ feature.title }}</h3>
        <p class="text-muted mb-4">{{ feature.text }} We are still setting this up and will let you know as soon as it is ready.</p>
        <a href="https://wa.me/2348069278540?text=Please%20notify%20me%20when%20{{ feature.title|urlencode }}%20is%20available" class="btn btn-primary w-100 mb-2">Notify me on WhatsApp</a>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-dark w-100">Back to dashboard</a>
    </div>
</div>
{% endblock %}
